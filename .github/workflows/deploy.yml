# Step 15: build the Vite site and deploy the generated `dist/` output to
# GitHub Pages (replaces the old workflow that uploaded the raw repository
# root, which shipped source files, node tooling, and migration docs to the
# live site).
#
# Deployment is restricted to the production branch `v1` for ALL trigger
# types, including manual runs (workflow_dispatch: branches) — a manual run
# from any other branch cannot publish. Pull requests get the same
# checkout/install/test/build validation but never upload the Pages
# artifact and never run the deploy job.
name: Build and deploy Vite site to GitHub Pages

on:
  # Runs on pushes targeting the production branch (v1 deploys the site)
  push:
    branches: ["main"]

  # Validation only: PRs are tested and built, never deployed
  pull_request:
    branches: ["v1"]

  # Manual runs are allowed only from the production branch
  workflow_dispatch:
    branches: ["v1"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build (and validate) job. On push/dispatch it also uploads the Pages
  # artifact; on pull_request it stops after tests + build.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      # Node 22 LTS — the same supported major version used in local
      # development; satisfies Vite 8's engine requirement
      # (^20.19.0 || >=22.12.0).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the built site is published
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
